name: CI

# Job order (cheap gates first, per user decision 2026-08-15):
#   lint-type + unit (pure TS, no native binary)  →  build-native (2 prebuilt
#   targets: linux-x64-gnu, win32-x64)  →  verify-native (dlopen + ldd gate on
#   the artifact, on a DIFFERENT distro than the builder).
# darwin and linux-arm64 were dropped from the prebuilt matrix on 2026-08-14 — those
# platforms use the installer's source-build fallback instead (scripts/install.ts).
# integration/bench-smoke jobs (docs/02-detail-design.md §10.1) come in a later milestone.
#
# `workflow_call` lets release.yml (tag v*) reuse this workflow's entire job chain
# instead of duplicating the definitions — a release only proceeds when verify-native
# passed too.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

# Cancel duplicate runs on the same PR/branch when a new push arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ASSUMPTION: native/CMakeLists.txt doesn't exist yet -- pin the toolchain version here so
  # the AlmaLinux 8 job can build the modern C11/C17 that librdkafka requires.
  GCC_TOOLSET: gcc-toolset-13

jobs:
  # ---------------------------------------------------------------------------------------
  # build-native: 2-target prebuilt matrix (docs/01-spec.md §6, docs/02-detail-design.md §9.2)
  # ---------------------------------------------------------------------------------------
  build-native:
    name: build-native (${{ matrix.target }})
    needs: [lint-type, unit]
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Target names are the loader's platform keys — release assets are named
          # libbunrdkafka-<target>.tar.gz and scripts/install.ts downloads by this key.
          - target: linux-x64-gnu
            os: ubuntu-24.04
            container: "almalinux:8"
          - target: win32-x64
            os: windows-2022
            container: ""
    steps:
      # The AlmaLinux 8 container has no git/cmake/compiler by default -- install them before
      # checkout (actions/checkout needs `git` to already be available in the container).
      - name: Install toolchain (AlmaLinux 8 container)
        if: matrix.container == 'almalinux:8'
        run: |
          # No -devel packages for openssl/zlib/zstd/lz4: the CI release build uses
          # BRK_STATIC_DEPS=ON, which builds all four statically at configure time
          # (native/cmake/StaticDeps.cmake) so the prebuilt depends only on the glibc
          # family — enforced by the ldd gate in verify-native. Leaving the system
          # -devel packages out makes any accidental system linkage fail loudly here.
          # cyrus-sasl-devel stays out too (see native/CMakeLists.txt — builtin
          # PLAIN/SCRAM/OAUTHBEARER don't need it; sonames differ across distros).
          # perl: required by OpenSSL's ./config.
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled powertools
          # epel-release: only for ccache (compiler cache — see the cache steps below).
          dnf install -y epel-release
          dnf install -y \
            ${GCC_TOOLSET}-gcc \
            ${GCC_TOOLSET}-gcc-c++ \
            ccache \
            cmake \
            make \
            git-core \
            perl \
            perl-IPC-Cmd \
            which \
            tar \
            gzip
          echo "PATH=/opt/rh/${GCC_TOOLSET}/root/usr/bin:$PATH" >> "$GITHUB_ENV"
          echo "CC=/opt/rh/${GCC_TOOLSET}/root/usr/bin/gcc" >> "$GITHUB_ENV"
          echo "CXX=/opt/rh/${GCC_TOOLSET}/root/usr/bin/g++" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=${GITHUB_WORKSPACE}/.ccache" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      # The windows-2022 runner image already has vcpkg installed at C:\vcpkg (VCPKG_INSTALLATION_ROOT).
      # ASSUMPTION: native/vcpkg.json exists (manifest mode), triplet x64-windows-static-md
      # as described in docs/02-detail-design.md §9.2 -- CMake will automatically run
      # `vcpkg install` during configure with the toolchain file below.
      # vcpkg binary cache: vcpkg's default "files" binary provider writes package
      # archives to %LOCALAPPDATA%\vcpkg\archives — caching that directory means a
      # rebuild restores openssl/zstd/zlib from archives instead of compiling them
      # from source (the dominant cost of the Windows job). build/vcpkg_installed is
      # cached too so an unchanged manifest skips the install step entirely.
      # (Deliberately NOT using the x-gha binary source: it depends on runner cache
      # protocol details; the archives directory works with any vcpkg version.)
      - name: Cache vcpkg binary archives (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\vcpkg\archives
            build/vcpkg_installed
          key: vcpkg-${{ matrix.target }}-${{ hashFiles('native/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ matrix.target }}-

      # librdkafka is pulled in via CMake FetchContent (per librdkafka.version) -- cache the
      # _deps directory (source + subbuild stamps) to skip the clone/download on every run.
      # NOTE: the CI build dir is ./build (cmake -B build), NOT native/build (the dev path).
      - name: Cache CMake FetchContent (_deps)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-${{ matrix.target }}-${{ hashFiles('librdkafka.version', 'native/CMakeLists.txt', 'native/cmake/StaticDeps.cmake') }}
          restore-keys: |
            fetchcontent-${{ matrix.target }}-

      # ccache makes recompiles content-addressed, so librdkafka's ~150 C files become
      # cache hits even though checkout refreshes file mtimes (which defeats naive
      # build-directory caching under make). Key on the SHA so the updated cache is
      # re-saved every run; restore-keys picks the most recent previous cache.
      - name: Cache ccache (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.target }}-

      - name: Configure (CMake)
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake -B build -S native \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          else
            # BRK_STATIC_DEPS: static OpenSSL/zlib/zstd/lz4 for a portable prebuilt
            # (the deps live under build/_deps → covered by the FetchContent cache).
            cmake -B build -S native -DCMAKE_BUILD_TYPE=Release \
              -DBRK_STATIC_DEPS=ON \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          fi

      - name: Build (CMake)
        run: cmake --build build --config Release --parallel

      - name: ccache stats (Linux)
        if: runner.os == 'Linux'
        run: ccache -s || true

      - name: Stage artifact
        run: |
          mkdir -p dist
          # ASSUMPTION: the output sits somewhere under build/ (the exact path depends on the
          # generator -- Ninja: build/, Visual Studio multi-config: build/Release/). Search by
          # file name/extension instead of hard-coding the path so this doesn't depend on the
          # generator.
          find build -type f \( -name "libbunrdkafka.so" -o -name "libbunrdkafka.dylib" -o -name "libbunrdkafka.dll" -o -name "bunrdkafka.dll" \) -exec cp {} dist/ \;
          ls -la dist
          test -n "$(ls -A dist)" || (echo "::error::no built library found under build/" && exit 1)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------
  # lint-type: tsc --noEmit across the whole repo (no native binary needed)
  # ---------------------------------------------------------------------------------------
  lint-type:
    name: lint-type
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install

      - name: Type-check
        run: bunx tsc --noEmit

  # ---------------------------------------------------------------------------------------
  # unit: pure-TS tests (unit + conformance) — runs BEFORE any native build as a cheap
  # gate. No artifact, no BUN_RDKAFKA_LIB_PATH: native-dependent tests skip cleanly
  # when no library is present (they are exercised against the real artifact in
  # verify-native below).
  # ---------------------------------------------------------------------------------------
  unit:
    name: unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install

      - name: bun test (unit + conformance, no native)
        run: bun test test/unit test/conformance

  # ---------------------------------------------------------------------------------------
  # verify-native: portability gate on the built artifact. Runs on ubuntu-24.04 — a
  # DIFFERENT distro than the AlmaLinux 8 builder — so a prebuilt that secretly
  # depends on the builder's system libraries (the OpenSSL 1.1 incident) fails here
  # instead of on user machines:
  #   1. ldd must show nothing beyond the glibc family (BRK_STATIC_DEPS contract);
  #   2. the library must dlopen and report all required librdkafka builtin.features
  #      (test/unit/native-features.test.ts fails loudly when BUN_RDKAFKA_LIB_PATH is set).
  # TODO (plan M7): a Windows verify job needs bun-on-windows — tracked separately.
  # ---------------------------------------------------------------------------------------
  verify-native:
    name: verify-native (linux-x64-gnu)
    needs: build-native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install

      - name: Download native artifact
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64-gnu
          path: native-lib

      - name: ldd gate — glibc family only
        run: |
          LIB_FILE="$(find native-lib -type f -name '*.so' | head -n1)"
          test -n "$LIB_FILE" || (echo "::error::no .so in the artifact" && exit 1)
          echo "BUN_RDKAFKA_LIB_PATH=$(cd "$(dirname "$LIB_FILE")" && pwd)/$(basename "$LIB_FILE")" >> "$GITHUB_ENV"
          ldd "$LIB_FILE"
          if ldd "$LIB_FILE" | grep -E 'libssl|libcrypto|libzstd|liblz4|libz\.|libsasl'; then
            echo "::error::prebuilt dynamically links a non-glibc dependency (must be static — BRK_STATIC_DEPS)"
            exit 1
          fi

      - name: dlopen + builtin.features against the artifact
        run: bun test test/unit/native-features.test.ts
